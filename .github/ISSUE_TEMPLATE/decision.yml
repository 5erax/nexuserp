name: Quyết định kiến trúc (ADR)
description: Một quyết định cần được chốt và ghi lại bằng ADR.
title: "P?-ADR-0NN ADR: Tiêu đề quyết định"
labels: ["type:decision", "status:needs-decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh
      description: Vấn đề, ràng buộc và lý do cần quyết định ngay bây giờ.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Các lựa chọn
      description: Mỗi lựa chọn nêu ưu điểm, nhược điểm, chi phí.
      value: |
        ### Lựa chọn A

        ### Lựa chọn B
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Đề xuất
  - type: dropdown
    id: deadline
    attributes:
      label: Cần chốt trước
      options:
        - Phase 0
        - Phase 1
        - Phase 2
        - Phase 3
        - Phase 4
        - Sau MVP
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Kết quả cần có
      value: |
        - [ ] ADR được viết trong `docs/adr/` với trạng thái Accepted
        - [ ] Tài liệu và issue bị ảnh hưởng được cập nhật
