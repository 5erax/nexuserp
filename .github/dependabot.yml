# Hiện chỉ cập nhật GitHub Actions. Khi monorepo và Docker được tạo
# (issue P0-ARC-001, P0-DEV-001, P0-DEV-003) hãy thêm các ecosystem "npm" và "docker".
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "type:chore"
      - "area:infra"
    groups:
      github-actions:
        patterns:
          - "*"
