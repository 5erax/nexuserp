name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env: { POSTGRES_USER: nexus, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: nexuserp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexuserp_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://nexus:ci_only@127.0.0.1:5432/nexuserp_test
      TEST_DATABASE_URL: postgresql://nexus:ci_only@127.0.0.1:5432/nexuserp_test
      API_INTERNAL_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      JWT_SECRET: foundation_ci_jwt_key_only_not_for_deployment
      CSRF_SECRET: foundation_ci_csrf_key_only_not_for_deployment
      WEB_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm docs:lint
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @nexus/api test:integration:foundation
      - run: pnpm --filter @nexus/api test:inventory:mutation
      - run: pnpm db:migrate && pnpm db:check
      - run: pnpm contracts:check
      - run: pnpm audit:production
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start built API and production web for browser tests
        run: |
          NODE_ENV=test pnpm --filter @nexus/api start > /tmp/nexus-api.log 2>&1 &
          pnpm --filter @nexus/web start > /tmp/nexus-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexus-api.log /tmp/nexus-web.log
          exit 1
      - run: pnpm test:e2e
      - name: Full dependency audit (tooling included)
        if: always()
        run: pnpm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-diagnostics
          path: |
            playwright-report/
            test-results/
            dependency-audit.json
            apps/api/coverage/
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          {
            POSTGRES_USER: nexus,
            POSTGRES_PASSWORD: security_ci_only,
            POSTGRES_DB: nexuserp_security_test,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexuserp_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://nexus:security_ci_only@127.0.0.1:5432/nexuserp_security_test
      TEST_DATABASE_URL: postgresql://nexus:security_ci_only@127.0.0.1:5432/nexuserp_security_test
      JWT_SECRET: security_ci_jwt_key_only_not_for_deployment
      CSRF_SECRET: security_ci_csrf_key_only_not_for_deployment
      WEB_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @nexus/api test:security
      - run: pnpm --filter @nexus/api test:security:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: iam-security-diagnostics, path: apps/api/coverage/ }
  dev-containers:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: dev_container_ci_jwt_key_only_not_for_deployment
      CSRF_SECRET: dev_container_ci_csrf_key_only_not_for_deployment
      POSTGRES_PASSWORD: dev_ci_only
      COMPOSE_DATABASE_URL: postgresql://nexus:dev_ci_only@postgres:5432/nexuserp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Start development profile on a clean runner
        run: |
          cp .env.example .env
          docker compose --profile dev up --build -d
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          docker compose --profile dev logs
          exit 1
      - name: Verify Nest and Next hot reload through source bind mounts
        run: node infrastructure/docker/check-dev-reload.cjs
      - name: Retain logs and remove only isolated CI resources
        if: always()
        run: |
          docker compose --profile dev logs > compose-dev.log
          docker compose --profile dev down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: development-container-diagnostics, path: compose-dev.log }
  containers:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: container_ci_jwt_key_only_not_for_deployment
      CSRF_SECRET: container_ci_csrf_key_only_not_for_deployment
      POSTGRES_PASSWORD: 'ci#only?%'
      COMPOSE_DATABASE_URL: postgresql://nexus:ci%23only%3F%25@postgres:5432/nexuserp
      API_RATE_LIMIT: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Compose
        run: |
          cp .env.example .env
          docker compose --profile app up --build -d
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose --profile app logs
          exit 1
      - name: Check runtime users
        run: |
          test "$(docker compose exec -T api id -u)" != 0
          test "$(docker compose exec -T web id -u)" != 0
          test "$(docker compose exec -T edge id -u)" != 0
          docker compose exec -T edge nginx -t
      - name: Verify trusted proxy isolation and spoof resistance
        run: |
          docker compose run -d --no-deps --name nexuserp-rate-a web node -e 'setInterval(()=>{},60000)'
          docker compose run -d --no-deps --name nexuserp-rate-b web node -e 'setInterval(()=>{},60000)'
          docker cp infrastructure/docker/check-proxy.cjs nexuserp-rate-a:/tmp/check-proxy.cjs
          docker cp infrastructure/docker/check-proxy.cjs nexuserp-rate-b:/tmp/check-proxy.cjs
          docker exec nexuserp-rate-a node /tmp/check-proxy.cjs blocked
          docker exec nexuserp-rate-b node /tmp/check-proxy.cjs fresh
      - name: Verify database volume survives restart
        run: |
          docker compose exec -T postgres psql -U nexus -d nexuserp -v ON_ERROR_STOP=1 -c "INSERT INTO organizations(id,code,name,updated_at) VALUES ('a63cc6bd-af86-4dbc-a0c3-5fd07c689e33','CI-PERSISTENCE','CI fixture',now())"
          docker compose restart postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U nexus -d nexuserp; then break; fi
            sleep 1
          done
          test "$(docker compose exec -T postgres psql -U nexus -d nexuserp -Atc "SELECT count(*) FROM organizations WHERE code='CI-PERSISTENCE'")" = 1
      - name: Stop isolated CI containers
        if: always()
        run: |
          docker rm -f nexuserp-rate-a nexuserp-rate-b || true
          docker compose --profile app down -v
