info:
  title: NexusERP API
  description: NexusERP API. Cookie sessions; unsafe requests require the exact
    Origin and X-CSRF-Token. Business data is filtered by organization, branch
    and ownership.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: nexus_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: nexus_refresh
  schemas:
    HealthData:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
      required:
        - status
    Meta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
          oneOf:
            - type: object
              additionalProperties: {}
            - type: array
              items:
                type: object
                required:
                  - field
                  - messages
                properties:
                  field:
                    type: string
                  messages:
                    type: array
                    items:
                      type: string
        requestId:
          type: string
      required:
        - code
        - message
        - details
        - requestId
    ApiErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
        - error
    CsrfData:
      type: object
      properties:
        csrfToken:
          type: string
      required:
        - csrfToken
    CsrfResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CsrfData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    LoginInput:
      type: object
      properties:
        organizationCode:
          type: string
        email:
          type: string
        password:
          type: string
          writeOnly: true
      required:
        - organizationCode
        - email
        - password
    SessionData:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    SessionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    ProfileRoleData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    Profile:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        email:
          type: string
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileRoleData"
        grants:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum:
                - ORG
                - BRANCH
                - OWN
        branchIds:
          type: array
          items:
            type: string
      required:
        - id
        - organizationId
        - email
        - displayName
        - mustChangePassword
        - roles
        - grants
        - branchIds
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          writeOnly: true
      required:
        - currentPassword
        - newPassword
    Object:
      type: object
      properties: {}
    UserRoleData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    UserData:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleData"
        branchIds:
          type: array
          items:
            type: string
      required:
        - id
        - email
        - displayName
        - status
        - mustChangePassword
        - createdAt
        - roles
        - branchIds
    PageMeta:
      type: object
      properties:
        requestId:
          type: string
        page:
          type: number
        pageSize:
          type: number
        total:
          type: number
      required:
        - requestId
        - page
        - pageSize
        - total
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserData"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - data
        - meta
    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    UserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UserData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
        - meta
    CreateUserInput:
      type: object
      properties:
        email:
          type: string
        displayName:
          type: string
        temporaryPassword:
          type: string
          writeOnly: true
          minLength: 12
        roleIds:
          type: array
          items:
            type: string
        branchIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
      required:
        - email
        - displayName
        - temporaryPassword
        - roleIds
        - branchIds
    UpdateUserInput:
      type: object
      properties:
        email:
          type: string
        displayName:
          type: string
        temporaryPassword:
          type: string
          writeOnly: true
          minLength: 12
        roleIds:
          type: array
          items:
            type: string
        branchIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
    GrantInput:
      type: object
      properties:
        code:
          type: string
        scope:
          type: string
          enum:
            - ORG
            - BRANCH
            - OWN
      required:
        - code
        - scope
    RoleData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/GrantInput"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - isSystem
        - permissions
        - createdAt
    RoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleData"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - data
        - meta
    PermissionData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        allowedScopes:
          type: array
          items:
            type: string
      required:
        - id
        - code
        - allowedScopes
    PermissionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PermissionData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    CreateRoleInput:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/GrantInput"
        code:
          type: string
        name:
          type: string
      required:
        - permissions
        - code
        - name
    RoleResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/RoleData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    PermissionsInput:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/GrantInput"
      required:
        - permissions
    BranchData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
      required:
        - id
        - code
        - name
        - status
    BranchListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BranchData"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - data
        - meta
    BranchResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/BranchData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    CreateBranchInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
      required:
        - code
        - name
    UpdateBranchInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    OrganizationData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        currency:
          type: string
        timezone:
          type: string
      required:
        - id
        - code
        - name
        - currency
        - timezone
    OrganizationResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OrganizationData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    UpdateOrganizationInput:
      type: object
      properties:
        name:
          type: string
        currency:
          type: string
          enum:
            - VND
        timezone:
          type: string
    AuditData:
      type: object
      properties:
        id:
          type: string
        branchId:
          type: string
          nullable: true
        actorId:
          type: string
          nullable: true
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        requestId:
          type: string
        createdAt:
          type: string
          format: date-time
        changes:
          type: object
          nullable: true
          oneOf:
            - type: object
              additionalProperties: {}
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
      required:
        - id
        - branchId
        - actorId
        - action
        - entityType
        - entityId
        - requestId
        - createdAt
        - changes
    CursorMeta:
      type: object
      properties:
        requestId:
          type: string
        nextCursor:
          type: string
          nullable: true
      required:
        - requestId
        - nextCursor
    AuditResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditData"
        meta:
          $ref: "#/components/schemas/CursorMeta"
      required:
        - data
        - meta
