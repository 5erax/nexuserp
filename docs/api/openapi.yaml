info:
  title: NexusERP API
  description: NexusERP API. Cookie sessions; unsafe requests require the exact
    Origin and X-CSRF-Token. Business data is filtered by organization, branch
    and ownership.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: nexus_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: nexus_refresh
  schemas:
    HealthData:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
      required:
        - status
    Meta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
        requestId:
          type: string
      required:
        - code
        - message
        - details
        - requestId
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
        - error
    CsrfData:
      type: object
      properties:
        csrfToken:
          type: string
      required:
        - csrfToken
    CsrfResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CsrfData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    LoginInput:
      type: object
      properties:
        organizationCode:
          type: string
        email:
          type: string
        password:
          type: string
          writeOnly: true
      required:
        - organizationCode
        - email
        - password
    SessionData:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    SessionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    RoleData:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
      required:
        - id
        - code
        - name
    Profile:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        email:
          type: string
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleData"
        grants:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum:
                - ORG
                - BRANCH
                - OWN
        branchIds:
          type: array
          items:
            type: string
      required:
        - id
        - organizationId
        - email
        - displayName
        - mustChangePassword
        - roles
        - grants
        - branchIds
    ProfileResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          writeOnly: true
      required:
        - currentPassword
        - newPassword
    ApiErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
        - error
